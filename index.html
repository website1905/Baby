            document.getElementById('bg1').pause();
            document.getElementById('bg2').play();
            
            document.getElementById('phase3').classList.remove('hidden');
            
            // Build Gallery
            const gallery = document.getElementById('gallery');
            for(let i = 1; i <= 25; i++) {
                const img = document.createElement('img');
                img.src = `${i}.jpg`;
                img.classList.add('slide');
                img.id = `slide-${i}`;
                if(i === 1) img.classList.add('active');
                gallery.appendChild(img);
            }

            // Start auto slide
            slideInterval = setInterval(() => { nextSlide() }, 3000);
        }

        function nextSlide() {
            let oldSlide = document.getElementById(`slide-${currentSlide}`);
            oldSlide.classList.remove('active');
            oldSlide.classList.add('prev');

            currentSlide++;
            
            if (currentSlide > 25) {
                clearInterval(slideInterval);
                showScratchCard();
                return;
            }
            
            let newSlide = document.getElementById(`slide-${currentSlide}`);
            newSlide.classList.remove('prev');
            newSlide.classList.add('active');
        }

        function manualSlide(dir) {
            clearInterval(slideInterval); // Stop auto if user interacts
            
            let oldSlide = document.getElementById(`slide-${currentSlide}`);
            oldSlide.classList.remove('active');
            if(dir > 0) oldSlide.classList.add('prev');
            
            currentSlide += dir;
            if (currentSlide < 1) currentSlide = 1;
            
            if (currentSlide > 25) {
                showScratchCard();
                return;
            }

            let newSlide = document.getElementById(`slide-${currentSlide}`);
            newSlide.classList.remove('prev');
            newSlide.classList.add('active');
        }

        /* --- Scratch Card Logic --- */
        function showScratchCard() {
            document.getElementById('phase3').classList.add('hidden');
            document.getElementById('phase4').classList.remove('hidden');
            initScratch();
        }

        function initScratch() {
            const canvas = document.getElementById('scratch-canvas');
            const ctx = canvas.getContext('2d');
            
            // Set canvas size to match CSS size
            canvas.width = 300;
            canvas.height = 300;
            
            // Fill with dark gray cover
            ctx.fillStyle = '#444';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Add instructions on top
            ctx.fillStyle = '#fff';
            ctx.font = '20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Scratch Here', 150, 150);

            let isDrawing = false;

            function scratch(e) {
                if (!isDrawing) return;
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX || e.touches[0].clientX) - rect.left;
                const y = (e.clientY || e.touches[0].clientY) - rect.top;
                
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(x, y, 20, 0, Math.PI * 2, false);
                ctx.fill();
            }

            canvas.addEventListener('mousedown', () => isDrawing = true);
            canvas.addEventListener('mouseup', () => isDrawing = false);
            canvas.addEventListener('mousemove', scratch);
            
            canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); });
            canvas.addEventListener('touchend', () => isDrawing = false);
            canvas.addEventListener('touchmove', scratch);
        }
    </script>
</body>
