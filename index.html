<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Baby ❤️</title>
    <style>
        /* --- GLOBAL STYLES & SMOOTH TRANSITIONS --- */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffc0cb; /* Initial Pink */
            transition: background-color 3s ease, background 3s ease;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        body.expose-theme {
            background-color: #4a0000;
            background: linear-gradient(135deg, #4a0000 0%, #8b0000 100%);
            color: white;
        }

        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 1.5s ease forwards; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- START SCREEN --- */
        #start-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffe4e1;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #start-btn {
            padding: 15px 40px;
            font-size: 24px;
            background: #ff69b4;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
            transition: transform 0.3s ease;
        }
        #start-btn:hover { transform: scale(1.05); }

        /* --- PHASE 1: LOVE THEME --- */
        #phase1 {
            width: 100%;
            max-width: 600px;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Memory Game */
        .memory-game {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 30px;
            perspective: 1000px;
        }
        .memory-card {
            width: 100%;
            aspect-ratio: 1;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            cursor: pointer;
        }
        .memory-card.flip { transform: rotateY(180deg); }
        .front-face, .back-face {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .front-face {
            transform: rotateY(180deg);
            background-size: cover;
            background-position: center;
        }
        .back-face {
            background: #ffb6c1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            color: white;
        }

        /* Scroll Text */
        #scroll-container {
            margin-top: 40px;
            background: rgba(255, 255, 255, 0.8);
            padding: 30px;
            border-radius: 15px;
            border: 2px dashed #ff69b4;
            opacity: 0;
        }

        /* Keypad */
        #locker-container {
            margin-top: 40px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            display: inline-block;
            opacity: 0;
        }
        #display {
            width: 100%;
            height: 50px;
            background: #f0f0f0;
            margin-bottom: 15px;
            border-radius: 10px;
            font-size: 28px;
            line-height: 50px;
            letter-spacing: 5px;
            text-align: center;
        }
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .key {
            padding: 15px;
            font-size: 20px;
            background: #ffb6c1;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .key:active { background: #ff69b4; }
        
        .hint-container {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        #hint-btn {
            background: #ff69b4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 15px;
            cursor: pointer;
        }
        #thought-popup {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 100;
            display: none;
        }
        #thought-popup img { max-width: 200px; border-radius: 10px; }

        /* --- PHASE 2: EXPOSE THEME --- */
        #phase2 {
            width: 100%;
            max-width: 800px;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            opacity: 0;
            transition: opacity 2s ease;
        }

        /* Slider */
        .slider-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            aspect-ratio: 9/16;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background: #000;
        }
        .slides {
            display: flex;
            height: 100%;
            transition: transform 0.8s ease-in-out;
        }
        .slide {
            min-width: 100%;
            height: 100%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .ctrl-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid white;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .ctrl-btn:hover { background: white; color: black; }

        /* Scratch Card */
        #scratch-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 40px auto;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none;
        }
        #gift-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0; left: 0;
        }
        #scratch-pad {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            cursor: pointer;
        }
        
    </style>
</head>
<body>

    <!-- Audio Elements -->
    <audio id="bg1" loop src="bg1.mp3"></audio>
    <audio id="bg2" loop src="bg2.mp3"></audio>

    <!-- Start Screen (To fix Autoplay issues) -->
    <div id="start-screen">
        <button id="start-btn">Open Surprise For My Baby ❤️</button>
    </div>

    <!-- PHASE 1: LOVE THEME -->
    <div id="phase1" class="hidden">
        <h2 style="color: #ff1493;">Let's play a little game first, my love!</h2>
        
        <div class="memory-game" id="memory-game">
            <!-- Cards generated by JS -->
        </div>

        <div id="scroll-container" class="hidden">
            <h3 style="color: #ff1493; margin-top:0;">Thank you...</h3>
            <p style="color: #555; line-height: 1.6;">
                Thank you for being there for me. Thank you for all the memories we've shared. 
                I have a very special surprise locked away just for you.
            </p>
        </div>

        <div id="locker-container" class="hidden">
            <div id="display"></div>
            <div class="keypad">
                <button class="key" onclick="pressKey(1)">1</button>
                <button class="key" onclick="pressKey(2)">2</button>
                <button class="key" onclick="pressKey(3)">3</button>
                <button class="key" onclick="pressKey(4)">4</button>
                <button class="key" onclick="pressKey(5)">5</button>
                <button class="key" onclick="pressKey(6)">6</button>
                <button class="key" onclick="pressKey(7)">7</button>
                <button class="key" onclick="pressKey(8)">8</button>
                <button class="key" onclick="pressKey(9)">9</button>
                <button class="key" onclick="clearKey()">C</button>
                <button class="key" onclick="pressKey(0)">0</button>
                <button class="key" style="background: #ff69b4; color:white;" onclick="checkCode()">OK</button>
            </div>
            <div class="hint-container">
                <button id="hint-btn">Hint: My baby's birthday</button>
            </div>
        </div>
    </div>

    <!-- Hint Popup -->
    <div id="thought-popup">
        <img src="thought.png" alt="Thought Bubble">
        <br>
        <button onclick="document.getElementById('thought-popup').style.display='none'" style="margin-top:10px; padding:5px 15px; border-radius:10px; border:none; background:#ffb6c1;">Close</button>
    </div>

    <!-- PHASE 2: EXPOSE THEME -->
    <div id="phase2" class="hidden">
        <h2>The Truth.</h2>
        <p style="font-style: italic; opacity: 0.8;">Did you really think I wouldn't find out?</p>
        
        <div class="slider-container">
            <div class="slides" id="slides-track">
                <!-- Slides generated by JS -->
            </div>
        </div>
        
        <div class="controls">
            <button class="ctrl-btn" onclick="prevSlide()">❮ Prev</button>
            <button class="ctrl-btn" onclick="nextSlide()">Next ❯</button>
        </div>

        <div id="scratch-container">
            <img src="gift.jpg" id="gift-image" alt="Gift">
            <canvas id="scratch-pad"></canvas>
            <p style="position: absolute; bottom: -30px; width: 100%; text-align: center; color: white;">Scratch to reveal your gift.</p>
        </div>
    </div>

    <script>
        /* --- GLOBAL VARIABLES & START UP --- */
        let audio1 = document.getElementById('bg1');
        let audio2 = document.getElementById('bg2');

        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('phase1').classList.remove('hidden');
            audio1.play();
            initMemoryGame();
        });

        /* --- MEMORY GAME LOGIC --- */
        const cardsArray = ['card1.jpg', 'card 2.jpg', 'card 3.jpg', 'card1.jpg', 'card 2.jpg', 'card 3.jpg'];
        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;
        let matchedPairs = 0;

        function initMemoryGame() {
            const gameBoard = document.getElementById('memory-game');
            // Shuffle cards
            cardsArray.sort(() => 0.5 - Math.random());

            cardsArray.forEach((imgSrc, index) => {
                const card = document.createElement('div');
                card.classList.add('memory-card');
                card.dataset.framework = imgSrc;
                card.innerHTML = `
                    <div class="front-face" style="background-image: url('${imgSrc}')"></div>
                    <div class="back-face">❤️</div>
                `;
                card.addEventListener('click', flipCard);
                gameBoard.appendChild(card);
            });
        }

        function flipCard() {
            if (lockBoard) return;
            if (this === firstCard) return;

            this.classList.add('flip');

            if (!hasFlippedCard) {
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            secondCard = this;
            checkForMatch();
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.framework === secondCard.dataset.framework;
            isMatch ? disableCards() : unflipCards();
        }

        function disableCards() {
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);
            resetBoard();
            matchedPairs++;
            
            if (matchedPairs === 3) {
                setTimeout(() => {
                    document.getElementById('scroll-container').classList.remove('hidden');
                    document.getElementById('scroll-container').classList.add('fade-in');
                    setTimeout(() => {
                        document.getElementById('locker-container').classList.remove('hidden');
                        document.getElementById('locker-container').classList.add('fade-in');
                    }, 2000);
                }, 1000);
            }
        }

        function unflipCards() {
            lockBoard = true;
            setTimeout(() => {
                firstCard.classList.remove('flip');
                secondCard.classList.remove('flip');
                resetBoard();
            }, 1000);
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }

        /* --- KEYPAD LOGIC --- */
        let codeInput = "";
        const display = document.getElementById('display');

        function pressKey(num) {
            if (codeInput.length < 4) {
                codeInput += num;
                display.innerText = "* ".repeat(codeInput.length);
            }
        }

        function clearKey() {
            codeInput = "";
            display.innerText = "";
        }

        document.getElementById('hint-btn').addEventListener('click', () => {
            document.getElementById('thought-popup').style.display = 'block';
        });

        function checkCode() {
            if (codeInput === "2309") {
                triggerPhase2();
            } else {
                display.innerText = "ERR";
                display.style.color = "red";
                setTimeout(() => {
                    clearKey();
                    display.style.color = "black";
                }, 1000);
            }
        }

        /* --- PHASE 2 TRANSITION --- */
        function triggerPhase2() {
            // Audio Transition
            audio1.pause();
            audio2.play();

            // UI Transition
            document.getElementById('phase1').classList.add('hidden');
            document.body.classList.add('expose-theme');
            
            const phase2 = document.getElementById('phase2');
            phase2.classList.remove('hidden');
            
            setTimeout(() => {
                phase2.style.opacity = 1;
                initSlider();
            }, 500);
        }

        /* --- SLIDER LOGIC --- */
        let currentSlide = 0;
        const totalSlides = 25;
        const track = document.getElementById('slides-track');
        let slideInterval;
        let isAutoPlaying = true;

        function initSlider() {
            for (let i = 1; i <= totalSlides; i++) {
                const slide = document.createElement('div');
                slide.classList.add('slide');
                slide.style.backgroundImage = `url('${i}.jpg')`;
                track.appendChild(slide);
            }
            startAutoSlide();
        }

        function updateSliderPosition() {
            track.style.transform = `translateX(-${currentSlide * 100}%)`;
            
            // Show scratch card after last slide
            if (currentSlide === totalSlides - 1) {
                document.getElementById('scratch-container').style.display = 'block';
                document.getElementById('scratch-container').classList.add('fade-in');
                initScratchCard();
            }
        }

        function nextSlide() {
            if (currentSlide < totalSlides - 1) {
                currentSlide++;
                updateSliderPosition();
            } else {
                stopAutoSlide();
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                updateSliderPosition();
                stopAutoSlide(); // Manual intervention stops auto
            }
        }

        function startAutoSlide() {
            slideInterval = setInterval(() => {
                if(isAutoPlaying) nextSlide();
            }, 3000); // changes every 3 seconds smoothly
        }

        function stopAutoSlide() {
            isAutoPlaying = false;
            clearInterval(slideInterval);
        }

        // Add manual event listeners to control buttons to stop auto-play
        document.querySelectorAll('.ctrl-btn').forEach(btn => {
            btn.addEventListener('click', stopAutoSlide);
        });

        /* --- SCRATCH CARD LOGIC --- */
        function initScratchCard() {
            const canvas = document.getElementById('scratch-pad');
            const ctx = canvas.getContext('2d');
            
            canvas.width = 300;
            canvas.height = 300;

            // Fill canvas with a silver overlay
            ctx.fillStyle = '#888888';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Add some text over the scratch layer
            ctx.font = "20px Arial";
            ctx.fillStyle = "#ffffff";
            ctx.textAlign = "center";
            ctx.fillText("Scratch Here", canvas.width/2, canvas.height/2);

            let isDrawing = false;

            function getMousePos(canvas, evt) {
                var rect = canvas.getBoundingClientRect();
                return {
                    x: (evt.clientX || evt.touches[0].clientX) - rect.left,
                    y: (evt.clientY || evt.touches[0].clientY) - rect.top
                };
            }

            function startPosition(e) {
                isDrawing = true;
                scratch(e);
            }

            function endPosition() {
                isDrawing = false;
                ctx.beginPath();
            }

            function scratch(e) {
                if (!isDrawing) return;
                e.preventDefault();
                
                const pos = getMousePos(canvas, e);
                
                ctx.globalCompositeOperation = 'destination-out';
                ctx.lineWidth = 40;
                ctx.lineCap = 'round';
                
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            }

            canvas.addEventListener('mousedown', startPosition);
            canvas.addEventListener('mouseup', endPosition);
            canvas.addEventListener('mousemove', scratch);
            
            // Touch support for mobile
            canvas.addEventListener('touchstart', startPosition);
            canvas.addEventListener('touchend', endPosition);
            canvas.addEventListener('touchmove', scratch);
        }

    </script>
</body>
</html>
