<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Baby ❤️</title>
    <style>
        /* --- GLOBAL STYLES --- */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffd1dc; /* Soft pastel pink */
            transition: background-color 2s ease, background 2s ease;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        body.expose-theme {
            background-color: #3a0000;
            background: linear-gradient(135deg, #2b0000 0%, #5c0000 100%);
            color: white;
        }

        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 1.5s ease forwards; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- START SCREEN --- */
        #start-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffe4e1;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        #start-btn {
            padding: 20px 40px;
            font-size: 22px;
            background: #a87eb6;
            color: #d4f0ff;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(168, 126, 182, 0.4);
            transition: transform 0.2s ease, background 0.3s;
            font-weight: bold;
        }
        #start-btn:active { transform: scale(0.95); }

        /* --- PHASE 1: LOVE THEME --- */
        #phase1 {
            width: 100%;
            max-width: 600px;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Memory Game */
        .memory-game {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 30px;
            perspective: 1000px;
        }
        .memory-card {
            width: 100%;
            aspect-ratio: 1;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            cursor: pointer;
        }
        .memory-card.flip { transform: rotateY(180deg); }
        .front-face, .back-face {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .front-face {
            transform: rotateY(180deg);
            background-size: cover;
            background-position: center;
            background-color: white;
        }
        .back-face {
            background: #ffb6c1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
        }

        /* Scroll Text */
        #scroll-container {
            margin-top: 40px;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 15px;
            border: 2px dashed #ff69b4;
            opacity: 0;
        }

        /* Keypad */
        #locker-container {
            margin-top: 40px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            display: inline-block;
            opacity: 0;
        }
        #display {
            width: 100%;
            height: 50px;
            background: #f0f0f0;
            margin-bottom: 15px;
            border-radius: 10px;
            font-size: 28px;
            line-height: 50px;
            letter-spacing: 5px;
            text-align: center;
            color: black;
        }
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .key {
            padding: 15px;
            font-size: 20px;
            background: #ffb6c1;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            color: black;
        }
        .key:active { background: #ff69b4; }
        
        .hint-container {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        #hint-btn {
            background: #ff69b4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 14px;
        }
        #thought-popup {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 100;
            display: none;
            text-align: center;
        }
        #thought-popup img { max-width: 250px; border-radius: 10px; }

        /* --- PHASE 2: EXPOSE THEME --- */
        #phase2 {
            width: 100%;
            max-width: 800px;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            opacity: 0;
            transition: opacity 2s ease;
        }

        /* Slider */
        .slider-container {
            position: relative;
            width: 100%;
            max-width: 350px;
            margin: 0 auto;
            aspect-ratio: 9/16;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            background: #111;
        }
        .slides {
            display: flex;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); /* Very smooth sliding */
        }
        .slide {
            min-width: 100%;
            height: 100%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .ctrl-btn {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid white;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .ctrl-btn:active { background: white; color: black; }

        /* Scratch Card */
        #scratch-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 40px auto;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none;
        }
        #gift-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0; left: 0;
        }
        #scratch-pad {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            cursor: pointer;
        }
        
    </style>
</head>
<body>

    <!-- Audio Elements - Preloaded safely -->
    <audio id="bg1" loop preload="auto">
        <source src="bg1.mp3" type="audio/mpeg">
    </audio>
    <audio id="bg2" loop preload="auto">
        <source src="bg2.mp3" type="audio/mpeg">
    </audio>

    <!-- Start Screen -->
    <div id="start-screen">
        <button id="start-btn">Click for your surprise! 💖✨</button>
    </div>

    <!-- PHASE 1 -->
    <div id="phase1" class="hidden">
        <h2 style="color: #ff1493; margin-top: 10px;">Let's play a little game first, my love!</h2>
        
        <div class="memory-game" id="memory-game">
            <!-- Cards injected by JS -->
        </div>

        <div id="scroll-container" class="hidden">
            <h3 style="color: #ff1493; margin-top:0;">Thank you...</h3>
            <p style="color: #555; line-height: 1.6; font-size: 18px;">
                Thank you for being there for me. Thank you for all the memories we've shared. 
                I have a very special surprise locked away just for you.
            </p>
        </div>

        <div id="locker-container" class="hidden">
            <div id="display"></div>
            <div class="keypad">
                <button class="key" onclick="pressKey(1)">1</button>
                <button class="key" onclick="pressKey(2)">2</button>
                <button class="key" onclick="pressKey(3)">3</button>
                <button class="key" onclick="pressKey(4)">4</button>
                <button class="key" onclick="pressKey(5)">5</button>
                <button class="key" onclick="pressKey(6)">6</button>
                <button class="key" onclick="pressKey(7)">7</button>
                <button class="key" onclick="pressKey(8)">8</button>
                <button class="key" onclick="pressKey(9)">9</button>
                <button class="key" onclick="clearKey()">C</button>
                <button class="key" onclick="pressKey(0)">0</button>
                <button class="key" style="background: #ff69b4; color:white; font-weight:bold;" onclick="checkCode()">OK</button>
            </div>
            <div class="hint-container">
                <button id="hint-btn" onclick="document.getElementById('thought-popup').style.display='block'">Hint: My baby's birthday</button>
            </div>
        </div>
    </div>

    <!-- Hint Popup -->
    <div id="thought-popup">
        <img src="thought.png" alt="Hint" onerror="this.src=''">
        <br>
        <button onclick="document.getElementById('thought-popup').style.display='none'" style="margin-top:15px; padding:10px 25px; border-radius:20px; border:none; background:#ffb6c1; font-weight:bold; cursor:pointer;">Close</button>
    </div>

    <!-- PHASE 2 -->
    <div id="phase2" class="hidden">
        <h2 style="margin-top: 10px;">The Truth.</h2>
        <p style="font-style: italic; opacity: 0.8; margin-bottom: 25px;">Did you really think I wouldn't find out?</p>
        
        <div class="slider-container">
            <div class="slides" id="slides-track">
                <!-- Slides injected by JS -->
            </div>
        </div>
        
        <div class="controls">
            <button class="ctrl-btn" onclick="prevSlide()">❮ Prev</button>
            <button class="ctrl-btn" onclick="nextSlide()">Next ❯</button>
        </div>

        <div id="scratch-container">
            <img src="gift.jpg" id="gift-image" alt="Gift">
            <canvas id="scratch-pad"></canvas>
            <p style="position: absolute; bottom: -30px; width: 100%; text-align: center; color: white;">Scratch to reveal</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const audio1 = document.getElementById('bg1');
            const audio2 = document.getElementById('bg2');

            // --- START UP (with error handling so it doesn't break) ---
            document.getElementById('start-btn').addEventListener('click', () => {
                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('phase1').classList.remove('hidden');
                
                // Safe Play Audio (Won't crash site if audio is missing)
                const playPromise = audio1.play();
                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        console.log("Audio 1 failed to play. Continuing without music.", error);
                    });
                }
                initMemoryGame();
            });

            // --- MEMORY GAME LOGIC ---
            // Used %20 to safely handle files with spaces like "card 2.jpg" on GitHub pages
            const cardsArray = ['card1.jpg', 'card%202.jpg', 'card%203.jpg', 'card1.jpg', 'card%202.jpg', 'card%203.jpg'];
            let hasFlippedCard = false;
            let lockBoard = false;
            let firstCard, secondCard;
            let matchedPairs = 0;

            function initMemoryGame() {
                const gameBoard = document.getElementById('memory-game');
                cardsArray.sort(() => 0.5 - Math.random()); // Shuffle

                cardsArray.forEach((imgSrc) => {
                    const card = document.createElement('div');
                    card.classList.add('memory-card');
                    card.dataset.framework = imgSrc;
                    card.innerHTML = `
                        <div class="front-face" style="background-image: url('${imgSrc}')"></div>
                        <div class="back-face">❤️</div>
                    `;
                    card.addEventListener('click', flipCard);
                    gameBoard.appendChild(card);
                });
            }

            function flipCard() {
                if (lockBoard) return;
                if (this === firstCard) return;

                this.classList.add('flip');

                if (!hasFlippedCard) {
                    hasFlippedCard = true;
                    firstCard = this;
                    return;
                }

                secondCard = this;
                checkForMatch();
            }

            function checkForMatch() {
                let isMatch = firstCard.dataset.framework === secondCard.dataset.framework;
                isMatch ? disableCards() : unflipCards();
            }

            function disableCards() {
                firstCard.removeEventListener('click', flipCard);
                secondCard.removeEventListener('click', flipCard);
                resetBoard();
                matchedPairs++;
                
                if (matchedPairs === 3) {
                    setTimeout(() => {
                        const scroll = document.getElementById('scroll-container');
                        scroll.classList.remove('hidden');
                        scroll.classList.add('fade-in');
                        
                        setTimeout(() => {
                            const locker = document.getElementById('locker-container');
                            locker.classList.remove('hidden');
                            locker.classList.add('fade-in');
                        }, 1500);
                    }, 800);
                }
            }

            function unflipCards() {
                lockBoard = true;
                setTimeout(() => {
                    firstCard.classList.remove('flip');
                    secondCard.classList.remove('flip');
                    resetBoard();
                }, 1000);
            }

            function resetBoard() {
                [hasFlippedCard, lockBoard] = [false, false];
                [firstCard, secondCard] = [null, null];
            }

            // --- KEYPAD LOGIC (Attached to window for inline onclick) ---
            window.codeInput = "";
            const display = document.getElementById('display');

            window.pressKey = function(num) {
                if (window.codeInput.length < 4) {
                    window.codeInput += num;
                    display.innerText = "* ".repeat(window.codeInput.length);
                }
            };

            window.clearKey = function() {
                window.codeInput = "";
                display.innerText = "";
            };

            window.checkCode = function() {
                if (window.codeInput === "2309") {
                    triggerPhase2();
                } else {
                    display.innerText = "ERR";
                    display.style.color = "red";
                    setTimeout(() => {
                        window.clearKey();
                        display.style.color = "black";
                    }, 800);
                }
            };

            // --- PHASE 2 TRANSITION ---
            function triggerPhase2() {
                // Audio Switch
                audio1.pause();
                const playPromise = audio2.play();
                if (playPromise !== undefined) {
                    playPromise.catch(e => console.log("Audio 2 failed", e));
                }

                // UI Switch
                document.getElementById('phase1').classList.add('hidden');
                document.body.classList.add('expose-theme');
                
                const phase2 = document.getElementById('phase2');
                phase2.classList.remove('hidden');
                
                setTimeout(() => {
                    phase2.style.opacity = 1;
                    initSlider();
                }, 500);
            }

            // --- SMOOTH SLIDER LOGIC ---
            let currentSlide = 0;
            const totalSlides = 25;
            const track = document.getElementById('slides-track');
            let slideInterval;
            let isAutoPlaying = true;

            function initSlider() {
                for (let i = 1; i <= totalSlides; i++) {
                    const slide = document.createElement('div');
                    slide.classList.add('slide');
                    slide.style.backgroundImage = `url('${i}.jpg')`;
                    track.appendChild(slide);
                }
                startAutoSlide();
            }

            function updateSliderPosition() {
                track.style.transform = `translateX(-${currentSlide * 100}%)`;
                
                if (currentSlide === totalSlides - 1) {
                    const scratch = document.getElementById('scratch-container');
                    scratch.style.display = 'block';
                    scratch.classList.add('fade-in');
                    initScratchCard();
                }
            }

            window.nextSlide = function() {
                stopAutoSlide(); // Manual click stops auto
                if (currentSlide < totalSlides - 1) {
                    currentSlide++;
                    updateSliderPosition();
                }
            };

            window.prevSlide = function() {
                stopAutoSlide();
                if (currentSlide > 0) {
                    currentSlide--;
                    updateSliderPosition();
                }
            };

            function startAutoSlide() {
                slideInterval = setInterval(() => {
                    if (isAutoPlaying && currentSlide < totalSlides - 1) {
                        currentSlide++;
                        updateSliderPosition();
                    } else {
                        stopAutoSlide();
                    }
                }, 3500);
            }

            function stopAutoSlide() {
                isAutoPlaying = false;
                clearInterval(slideInterval);
            }

            // --- SCRATCH CARD LOGIC ---
            function initScratchCard() {
                const canvas = document.getElementById('scratch-pad');
                const ctx = canvas.getContext('2d');
                
                canvas.width = 300;
                canvas.height = 300;

                ctx.fillStyle = '#888888';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.font = "24px Arial";
                ctx.fillStyle = "#ffffff";
                ctx.textAlign = "center";
                ctx.fillText("Scratch Here", canvas.width/2, canvas.height/2);

                let isDrawing = false;

                function getMousePos(canvas, evt) {
                    var rect = canvas.getBoundingClientRect();
                    return {
                        x: (evt.clientX || evt.touches?.[0].clientX) - rect.left,
                        y: (evt.clientY || evt.touches?.[0].clientY) - rect.top
                    };
                }

                function startPosition(e) {
                    isDrawing = true;
                    scratch(e);
                }

                function endPosition() {
                    isDrawing = false;
                    ctx.beginPath();
                }

                function scratch(e) {
                    if (!isDrawing) return;
                    e.preventDefault(); // Prevents screen scrolling while scratching on mobile
                    
                    const pos = getMousePos(canvas, e);
                    
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.lineWidth = 45;
                    ctx.lineCap = 'round';
                    
                    ctx.lineTo(pos.x, pos.y);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(pos.x, pos.y);
                }

                canvas.addEventListener('mousedown', startPosition);
                canvas.addEventListener('mouseup', endPosition);
                canvas.addEventListener('mousemove', scratch);
                
                canvas.addEventListener('touchstart', startPosition, {passive: false});
                canvas.addEventListener('touchend', endPosition);
                canvas.addEventListener('touchmove', scratch, {passive: false});
            }
        });
    </script>
</body>
</html>
